<template id="account-view">
  <div class="page-content account-page">
    <h1>Your account</h1><p class="page-intro"></p>
    <form class="ledger-form" data-form="account">
      <label>Name<input name="name" maxlength="80" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>New password <span class="field-hint">Optional. Use a made-up password for this preview.</span><input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>
      <label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" maxlength="128"></label>
      <p class="form-error" role="alert" hidden></p>
      <div class="form-actions">
        <button class="button primary" type="submit">Save profile</button>
        <a class="button" href="#/overview">Back to overview</a>
      </div>
    </form>
  </div>
</template>

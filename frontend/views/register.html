<template id="register-view">
  <section class="auth-form-panel">
    <h2>Create an account</h2>
    <p class="form-intro">Join as a regular user. Admin access is managed separately.</p>
    <form data-form="register" class="ledger-form">
      <label>Name<input name="name" autocomplete="name" maxlength="80" required></label>
      <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <p class="form-error" role="alert" hidden></p>
      <button class="button primary" type="submit">Create account <span data-icon="arrow"></span></button>
    </form>
    <p class="auth-switch">Already have an account? <a href="#/login">Log in</a></p>
  </section>
</template>
